<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050706" stop-opacity="0.99" />
      <stop offset="0.42" stop-color="#050706" stop-opacity="0.9" />
      <stop offset="0.7" stop-color="#050706" stop-opacity="0.22" />
      <stop offset="1" stop-color="#050706" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.65" stop-color="#050706" stop-opacity="0" />
      <stop offset="1" stop-color="#050706" stop-opacity="0.38" />
    </linearGradient>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="630" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <image href="robot-challenge.jpg" width="1200" height="675" y="-22" preserveAspectRatio="xMidYMid slice" />
    <rect width="1200" height="630" fill="url(#shade)" />
    <rect width="1200" height="630" fill="url(#floor)" />

    <path d="M42 82V48H76 M1124 48H1158V82 M42 548V582H76" fill="none" stroke="#F4F7F4" stroke-opacity="0.42" stroke-width="2" />

    <image href="logo-wizard.png" x="62" y="54" width="248" height="87" preserveAspectRatio="xMinYMid meet" />

    <text x="66" y="197" fill="#39FF14" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">WIZARD / TU EXPERIENCIA</text>

    <text x="62" y="305" fill="#F4F7F4" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-5">¿NO QUE NO</text>
    <text x="62" y="398" fill="#F4F7F4" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-5">SE POD<tspan fill="#39FF14" filter="url(#greenGlow)">IA</tspan>?</text>

    <line x1="66" y1="446" x2="454" y2="446" stroke="#39FF14" stroke-width="4" />
    <text x="66" y="493" fill="#F4F7F4" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="600">Una conversación de 3 minutos.</text>
    <text x="66" y="528" fill="#BFC7C1" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="500">Tu opinión, sin filtro.</text>
  </g>
</svg>
